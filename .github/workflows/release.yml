name: build-windows-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[build,dev]"
      - name: Verify release version sources and tag
        run: python scripts/check_release_version.py
      - run: python -m ruff check .
      - run: python -m pytest -vv -o faulthandler_timeout=180
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
      - run: python scripts/build_icon.py
      - run: python -m PyInstaller --noconfirm --clean DupeSpace.spec
      - name: Verify frozen application excludes retired Drive clients and credentials
        shell: pwsh
        run: ./scripts/check_frozen_contents.ps1 -Executable "dist/DupeSpace/DupeSpace.exe"
      - name: Smoke test packaged native application
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/DupeSpace/DupeSpace.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) { throw "Packaged application did not exit its smoke test" }
          if ($app.ExitCode -ne 0) { throw "Packaged application smoke test failed" }
      - shell: powershell
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "packaging\\dupespace.iss"'
      - name: Exercise actual Recycle Bin on generated CI fixtures
        run: python -m pytest tests/test_recycle_bin_integration.py
        env:
          DUPESPACE_RECYCLE_QA: "1"
      - name: Download supported upgrade baselines
        shell: pwsh
        run: |
          foreach ($version in @("v1.5.1", "v1.6.0", "v1.7.0")) {
            gh release download $version --pattern DupeSpace-Setup.exe --dir "previous-installer/$version"
          }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate supported upgrades and uninstall in disposable Windows runner
        shell: pwsh
        run: |
          foreach ($version in @("v1.5.1", "v1.6.0", "v1.7.0")) {
            ./scripts/test_installer_upgrade.ps1 `
              -PreviousInstaller "previous-installer/$version/DupeSpace-Setup.exe" `
              -NewInstaller "release/DupeSpace-Setup.exe" `
              -BaselineVersion $version
          }
      - name: Record installer SHA-256
        shell: pwsh
        run: |
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath "release/DupeSpace-Setup.exe").Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("release/SHA256SUMS.txt", "$digest  DupeSpace-Setup.exe`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: DupeSpace-Windows
          path: |
            release/DupeSpace-Setup.exe
            release/SHA256SUMS.txt
            dist/DupeSpace/**
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/DupeSpace-Setup.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
