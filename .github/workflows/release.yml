name: build-windows-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[build]"
      - name: Inject public Desktop OAuth client ID
        shell: pwsh
        env:
          DESKTOP_CLIENT_ID: ${{ secrets.DUPESPACE_GOOGLE_DESKTOP_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_CLIENT_ID)) {
            throw "Required DupeSpace Desktop OAuth Client ID is not configured"
          }
          $id = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:DESKTOP_CLIENT_ID))
          $content = "import base64`nCLIENT_ID = base64.b64decode('$id').decode('utf-8')`n"
          [IO.File]::WriteAllText("src/dupespace/_desktop_oauth.py", $content, [Text.UTF8Encoding]::new($false))
      - run: python scripts/build_icon.py
      - run: python -m PyInstaller --noconfirm --clean DupeSpace.spec
      - shell: powershell
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "packaging\\dupespace.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: DupeSpace-Windows
          path: |
            release/DupeSpace-Setup.exe
            dist/DupeSpace/**
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/DupeSpace-Setup.exe
          generate_release_notes: true
