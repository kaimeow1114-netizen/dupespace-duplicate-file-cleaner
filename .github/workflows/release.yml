name: build-windows-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[build]"
      - run: python scripts/build_icon.py
      - run: python -m PyInstaller --noconfirm --clean DupeSweep.spec
      - shell: powershell
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "packaging\\dupesweep.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: DupeSweep-Windows
          path: |
            release/DupeSweep-Setup.exe
            dist/DupeSweep/**
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/DupeSweep-Setup.exe
          generate_release_notes: true
