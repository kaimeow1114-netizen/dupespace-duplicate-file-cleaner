name: 功能建議
description: 提出能讓 DUPESPACE 更安全或更容易使用的改善
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 請先描述使用情境與阻礙，不必先決定介面長相。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方式
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 對檔案安全或隱私的影響
      description: 如果沒有影響，也請簡短說明。
    validations:
      required: true
