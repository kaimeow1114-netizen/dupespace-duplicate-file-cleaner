name: 問題回報
description: 回報掃描、登入、介面或清理結果異常
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感謝協助改善 DUPESPACE。請勿貼上 OAuth Token、Client Secret、密碼或私人檔案內容。CSV 可能包含完整路徑，上傳前請先移除敏感資訊。
  - type: input
    id: version
    attributes:
      label: DUPESPACE 版本
      placeholder: 例如 1.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 發生問題的區域
      options:
        - 本機資料夾選取
        - 本機掃描
        - Google Drive 登入
        - Google Drive 掃描
        - 移至垃圾桶
        - 永久刪除
        - 更新程式
        - 其他介面
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請依操作順序描述，並註明加入了幾個掃描位置。
      placeholder: |
        1. 開啟本機清理
        2. 加入 1 個資料夾
        3. 點擊開始安全掃描
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際結果與完整錯誤文字
      description: 可以附上已遮蔽私人路徑的畫面截圖。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私檢查
      options:
        - label: 我已確認內容不含 OAuth Token、Secret、密碼或不願公開的檔案內容與路徑。
          required: true
